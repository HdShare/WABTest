name: Android CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/**'
      - '.editorconfig'
      - '.gitignore'
      - 'renovate.json'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-ci:
    name: Build CI
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, '[skip ci]') && github.ref == 'refs/heads/master' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        env:
          KEY_STORE_PATH: '../keystore.jks'
          KEY_STORE_PASSWORD: ${{ secrets.SIGN_KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          echo ${{ secrets.SIGN_KEY_STORE_BASE64 }} | base64 -d > keystore.jks

          ./gradlew build
          echo "APK_FILE_RELEASE=$(find app/build/outputs/apk/release -type f -name '*.apk')" >> $GITHUB_ENV

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APK_FILE_RELEASE }}
          name: WABTest-release-${{ github.event.head_commit.id }}
