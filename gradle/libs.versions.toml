[versions]
agp = "8.13.2"
kotlin = "2.4.10"
devtools-ksp = "2.3.11"

[libraries]
annotation = { module = "androidx.annotation:annotation", version = "1.10.0" }
xposed-api = { module = "de.robv.android.xposed:api", version = "82" }
yukihookapi-api = { module = "com.highcapable.yukihookapi:api", version = "1.3.2" }
yukihookapi-ksp-xposed = { module = "com.highcapable.yukihookapi:ksp-xposed", version = "1.3.2" }
kavaref-bom = { module = "com.highcapable.kavaref:kavaref-bom", version = "1.1.0" }
kavaref-android = { module = "com.highcapable.kavaref:kavaref-android" }
kavaref-core = { module = "com.highcapable.kavaref:kavaref-core" }
kavaref-extension = { module = "com.highcapable.kavaref:kavaref-extension" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.11.0" }
kotlinx-serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version = "1.11.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "devtools-ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
