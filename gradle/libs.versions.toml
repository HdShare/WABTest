[versions]
agp = "9.4.1"
kotlin = "2.4.20"
devtools-ksp = "2.3.12"
yukihook-bom = "1.5.0-beta.3"

[libraries]
libxposed-api = { module = "io.github.libxposed:api", version = "102.0.0" }
xposed-api = { module = "de.robv.android.xposed:api", version = "82" }

yukihook-bom = { module = "com.highcapable.yukihookapi:yukihook-bom", version.ref = "yukihook-bom" }
yukihook-core = { module = "com.highcapable.yukihookapi:yukihook-core" }
yukihook-runtime-libxposed = { module = "com.highcapable.yukihookapi:yukihook-runtime-libxposed" }
yukihook-runtime-xposed82 = { module = "com.highcapable.yukihookapi:yukihook-runtime-xposed82" }
yukihook-compiler = { module = "com.highcapable.yukihookapi:yukihook-compiler" }

kavaref-bom = { module = "com.highcapable.kavaref:kavaref-bom", version = "1.1.0" }
kavaref-android = { module = "com.highcapable.kavaref:kavaref-android" }
kavaref-core = { module = "com.highcapable.kavaref:kavaref-core" }
kavaref-extension = { module = "com.highcapable.kavaref:kavaref-extension" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.11.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "devtools-ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
